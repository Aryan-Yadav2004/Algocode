name: Deploy AlgoCode to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ATLAS_DB_URL: ${{ secrets.ATLAS_DB_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Disable host key checking
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key $EC2_USER@$EC2_HOST << 'REMOTE_SCRIPT'
            set -e

            echo "==> 1. Updating codebase from Git..."
            if [ ! -d "Algocode" ]; then
              git clone https://github.com/Aryan-Yadav2004/Algocode.git Algocode
            fi
            cd Algocode
            git fetch origin main
            git reset --hard origin/main

            echo "==> 2. Writing environment secrets..."
            cat << ENVFILE > .env
            ATLAS_DB_URL=${ATLAS_DB_URL}
            VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
            ENVFILE

            echo "==> 3. Building and running microservices..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "==> 4. Pruning dangling Docker images..."
            docker image prune -f

            echo "==> Deployment Complete! All services running."
            docker compose -f docker-compose.prod.yml ps
          REMOTE_SCRIPT
